name: Deploy Nexor static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/nexor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/nexor/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Preserve BrowserRouter fallback
        run: cp dist/index.html dist/404.html
      - name: Preserve custom domain
        run: printf 'nexoradvance.com.br\n' > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/nexor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
